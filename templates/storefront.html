{% extends "base.html" %}

{% block content %}
<header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
    <h1 class="h2 fw-bold text-dark">Storefront</h1>
    <span class="badge bg-light text-dark border">Abayas Collection 2026</span>
</header>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100 border-0 shadow-sm position-relative" style="border-radius: 15px; overflow: hidden;">
            <span class="badge position-absolute top-0 end-0 m-3 {{ 'bg-success' if product.quantity > 0 else 'bg-danger' }}">
                {{ product.quantity }} In Stock
            </span>

            <img src="{{ url_for('static', filename='uploads/' + (product.image_path if product.image_path else 'default.jpg')) }}"
                 class="card-img-top" alt="{{ product.name }}" style="height: 250px; object-fit: cover;">

            <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold mb-1">{{ product.name }}</h5>
                <p class="text-muted small mb-3 text-uppercase tracking-wider">{{ product.category }}</p>

                <div class="mt-auto">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="h4 mb-0 text-primary fw-bold">${{ "%.2f"|format(product.price) }}</span>
                    </div>

                    <form action="{{ url_for('buy_product', p_id=product.product_id) }}" method="POST">
                        <div class="input-group mb-2">
                            <span class="input-group-text bg-light border-end-0">Qty</span>
                            <input type="number" name="quantity" class="form-control border-start-0"
                                   value="1" min="1" max="{{ product.quantity }}"
                                   {{ 'disabled' if product.quantity <= 0 }} required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2"
                                {{ 'disabled' if product.quantity <= 0 }}>
                            {{ 'Purchase Now' if product.quantity > 0 else 'Sold Out' }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
