{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 p-4" style="border-radius: 20px;">
            <div class="card-body">
                <h2 class="fw-bold mb-4 text-center">Add New Abaya</h2>
                <form action="/add-product" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Product Name</label>
                        <input type="text" name="p_name" class="form-control form-control-lg" required placeholder="Silk Velvet Abaya">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold small text-muted text-uppercase">Price ($)</label>
                            <input type="number" step="0.01" name="p_price" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold small text-muted text-uppercase">Stock Qty</label>
                            <input type="number" name="p_qty" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Category</label>
                        <input type="text" name="p_category" class="form-control" required placeholder="Evening Wear">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Product Image</label>
                        <input type="file" name="p_image" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-3 fw-bold shadow-sm">Add to Catalog</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
