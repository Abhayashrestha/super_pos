{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; font-family: sans-serif;">
    <h2>Add New Product</h2>

    <form action="/add-product" method="POST" enctype="multipart/form-data">

        <div style="margin-bottom: 15px;">
            <label>Product Name:</label><br>
            <input type="text" name="p_name" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Price:</label><br>
            <input type="number" step="0.01" name="p_price" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Quantity:</label><br>
            <input type="number" name="p_qty" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Category:</label><br>
            <input type="text" name="p_category" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Product Image:</label><br>
            <input type="file" name="p_image" accept="image/*">
            <p style="font-size: 0.8em; color: #666;">Leave empty for 'Coming Soon' placeholder.</p>
        </div>

        <button type="submit" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">
            Add to Inventory
        </button>
    </form>
</div>
{% endblock %}
