<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Inventory System</title>
    <style>
        /* Modern Reset & Base Styles */
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
        }

        /* Navigation Bar */
        nav {
            background-color: #0f172a;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #f8fafc;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #38bdf8;
        }

        /* Content Container */
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Flash Messages */
        .alert {
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            border: 1px solid transparent;
            font-weight: 500;
        }

        /* Success looks green/blue, Error looks red */
        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
        }
        .alert-error, .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MAGNUM OPUS AI</div>
        <div>
            <a href="/">Storefront</a>
            <a href="/add-product">Add Product</a>
            <a href="/insights">Insights</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
